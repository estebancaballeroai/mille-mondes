stage.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;e.preventDefault();stage.setPointerCapture(e.pointerId);const p=point(e);pressed.set(e.pointerId,p);if(pressed.size===1){moved=false;pinch=false;startPoint=p}else{pinch=true;moved=true;startPoint=null;lastDistance=0}stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!pressed.has(e.pointerId)||!ready)return;e.preventDefault();const p=point(e),prev=pressed.get(e.pointerId);pressed.set(e.pointerId,p);if(pressed.size===2){pinch=true;moved=true;const arr=[...pressed.values()],dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(lastDistance)zoomAt(dist/lastDistance,(arr[0].x+arr[1].x)/2,(arr[0].y+arr[1].y)/2);lastDistance=dist}else if(!pinch){if(startPoint&&Math.hypot(p.x-startPoint.x,p.y-startPoint.y)>7)moved=true;ox+=p.x-prev.x;oy+=p.y-prev.y;bounds();draw()}});
stage.addEventListener('pointerup',e=>{if(!pressed.has(e.pointerId))return;const p=point(e),tap=pressed.size===1&&!pinch&&!moved&&startPoint&&Math.hypot(p.x-startPoint.x,p.y-startPoint.y)<12;pressed.delete(e.pointerId);lastDistance=0;if(pressed.size===0){stage.classList.remove('dragging');pinch=false;startPoint=null}if(tap)inspectTap(p.x,p.y)});
stage.addEventListener('pointercancel',e=>{pressed.delete(e.pointerId);pinch=true;lastDistance=0;if(!pressed.size){pinch=false;startPoint=null;stage.classList.remove('dragging')}});
stage.addEventListener('wheel',e=>{if(!ready)return;e.preventDefault();const p=point(e);zoomAt(e.deltaY<0?1.19:.84,p.x,p.y)},{passive:false});
canvas.addEventListener('keydown',e=>{const amount=60;if(e.key==='+'||e.key==='='){zoomButton(1.28);e.preventDefault()}else if(e.key==='-'){zoomButton(.78);e.preventDefault()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){if(e.key==='ArrowLeft')ox+=amount;if(e.key==='ArrowRight')ox-=amount;if(e.key==='ArrowUp')oy+=amount;if(e.key==='ArrowDown')oy-=amount;bounds();draw();e.preventDefault()}});
$('plus').onclick=()=>zoomButton(1.43);$('minus').onclick=()=>zoomButton(1/1.43);$('home').onclick=fit;$('difficulty').onclick=pickDifficulty;
$('observe').onclick=()=>{gameMode='observe';renderModes();showMessage(messageText())};$('touch').onclick=()=>{gameMode='touch';renderModes();showMessage(messageText())};
$('show-all').onclick=()=>{allSolutions=!allSolutions;focused=null;draw();$('show-all').textContent=allSolutions?'Masquer':'Solutions';showMessage(allSolutions?'Tous les objets sont entourés.':'Les réponses sont masquées.')};
$('restart').onclick=()=>dialog('Recommencer ce quartier ?','Les découvertes du quartier et du niveau actifs seront effacées. Les autres progressions sont conservées.',[['Effacer',()=>{delete progress[key()];save();focused=null;allSolutions=false;renderList();draw();closeModal()}],['Annuler',closeModal]]);
$('help').onclick=()=>dialog('Comment jouer ?','1. Choisis un quartier et une difficulté. 2. Glisse et zoome dans le décor. 3. Mode Observer : trouve visuellement chaque détail, puis utilise « Trouvé » dans la liste ; aucun clic sur l’image n’est nécessaire. 4. Mode Toucher : touche directement les objets. 5. « Montrer » révèle la zone si tu bloques. Les découvertes sont sauvegardées localement. Les scènes sont des illustrations historiques imaginaires, non des plans fidèles de la Rome antique.');
$('history').onclick=()=>{const done=DATA.reduce((sum,x)=>sum+(Array.isArray(progress[x.id+'-'+profile])?progress[x.id+'-'+profile].length:0),0);dialog('Carnet d’exploration',done+' / 24 découvertes dans ce parcours. Chaque scène associe observation, personnages et objets de la vie quotidienne à quelques explications historiques. Le carnet détaillé sera enrichi dans les prochaines versions.')};
window.addEventListener('resize',()=>{if(ready)fit()});
renderModes();selectDistrict(0);
window.MM_TEST={getState:()=>({district:current().id,profile,mode:gameMode,ready,found:[...found()],scale,baseScale,items:current().items.map(x=>({id:x.id,x:x.x,y:x.y}))}),changeDistrict:selectDistrict,setDifficulty};
})();
</script></body></html>
