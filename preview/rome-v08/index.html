<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mille Mondes Rome V0.8</title><style>*{box-sizing:border-box}body{margin:0;background:#132c30;color:#f9e5b4;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{background:#173b40;color:#ffe7b5;border:2px solid #c6a16d;border-radius:22px;padding:10px;font-size:16px}#top,#bottom{position:fixed;left:50%;transform:translateX(-50%);background:#142d31dc;border-radius:20px;padding:8px;display:flex;gap:7px;align-items:center;max-width:98vw;overflow:auto;z-index:2}#top{top:6px}#bottom{bottom:6px}#top.hidden,#bottom.hidden{display:none}.toggle{position:fixed;z-index:3;left:50%;transform:translateX(-50%);padding:2px 20px;background:#eac98d;color:#382817}#showtop{top:0}#showbottom{bottom:0}#zoom{position:fixed;left:6px;top:45%;display:grid;gap:8px;z-index:2}#zoom button{font-size:24px}#count{white-space:nowrap;font-weight:bold}#items{display:flex;gap:5px}#items button{font-size:12px;white-space:nowrap}#items .found{background:#456a4b;opacity:.55}#items button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:82px}#items img{width:76px;height:58px;object-fit:cover;border-radius:8px;border:1px solid #d5b989}#items small{font-size:11px}@media(max-height:440px){button{padding:6px;font-size:13px}#top{top:2px}#bottom{bottom:2px}}</style><canvas id="view"></canvas><div id="top" class="hidden"><button data-scene="0">Forum</button><button data-scene="1">Port</button><button data-scene="2">Marché</button><button id="reset">Recommencer</button></div><button id="showtop" class="toggle" aria-label="Afficher les quartiers">⌄ Menu</button><div id="zoom"><button id="zin">+</button><button id="zout">−</button></div><div id="bottom" class="hidden"><span id="count"></span><div id="items"></div></div><button id="showbottom" class="toggle" aria-label="Afficher les objets">⌃ Objets</button><script>const names=['Forum','Port','Marché'],urls=['forum.webp','port.webp','marche.webp'].map(n=>'../rome-v04/assets/'+n),canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let scene=0,scale=1,dx=0,dy=0,drag=null,pointers=new Map(),images=urls.map(u=>{let i=new Image();i.src=u;i.onload=draw;return i});const hotspots=[[[.35,.324],[.24,.835],[.203,.54],[.354,.659],[.397,.554],[.573,.733],[.2,.238],[.405,.379]],[[.096,.14],[.22,.32],[.39,.51],[.55,.63],[.7,.4],[.8,.72],[.6,.85],[.34,.78]],[[.15,.3],[.25,.6],[.35,.48],[.48,.75],[.58,.3],[.7,.6],[.82,.42],[.9,.78]]];const targets=[['Statue','Colonne','Bannière','Marchand','Cheval','Fontaine','Charrette','Temple'],['Bateau','Amphore','Marin','Corde','Voile','Panier','Quai','Poisson'],['Fruits','Balance','Potier','Tissu','Panier','Lampe','Étal','Pièce']];let found=JSON.parse(localStorage.getItem('mm-v08-found')||'{}');function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;draw()}function fit(){const i=images[scene];return i.complete&&i.naturalWidth?Math.max(canvas.width/i.width,canvas.height/i.height):1}function draw(){const i=images[scene];ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#122b30';ctx.fillRect(0,0,canvas.width,canvas.height);if(!i.complete||!i.naturalWidth)return;let k=fit()*scale,w=i.width*k,h=i.height*k;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(i,(canvas.width-w)/2+dx,(canvas.height-h)/2+dy,w,h)}function zoom(v,x=canvas.width/2,y=canvas.height/2){let old=scale;scale=Math.max(1,Math.min(5,scale*v));dx=(dx+(canvas.width/2-x))*(scale/old)-(canvas.width/2-x);dy=(dy+(canvas.height/2-y))*(scale/old)-(canvas.height/2-y);draw()}function discover(e){const i=images[scene];if(!i.naturalWidth)return;let k=fit()*scale,w=i.width*k,h=i.height*k;let px=(e.clientX*devicePixelRatio-((canvas.width-w)/2+dx))/w,py=(e.clientY*devicePixelRatio-((canvas.height-h)/2+dy))/h;const n=hotspots[scene].findIndex(([x,y],j)=>Math.hypot((px-x)*w,(py-y)*h)<Math.max(35*devicePixelRatio,Math.min(w,h)*.045)&&!(found[scene]||[]).includes(j));if(n>=0){found[scene]??=[];found[scene].push(n);localStorage.setItem('mm-v08-found',JSON.stringify(found));menu();document.getElementById('count').textContent='Trouvé : '+targets[scene][n]+' · '+found[scene].length+'/8';}}function thumb(n){const im=images[scene];if(!im.naturalWidth)return '';const p=hotspots[scene][n],c=document.createElement('canvas');c.width=152;c.height=116;const g=c.getContext('2d'),sw=im.width*.14,sh=sw*116/152;g.drawImage(im,Math.max(0,Math.min(im.width-sw,im.width*p[0]-sw/2)),Math.max(0,Math.min(im.height-sh,im.height*p[1]-sh/2)),sw,sh,0,0,152,116);return c.toDataURL('image/jpeg',.72)}images.forEach(im=>im.addEventListener('load',()=>{menu();draw()}));function menu(){document.getElementById('count').textContent=names[scene]+' · '+(found[scene]||[]).length+'/8';document.getElementById('items').innerHTML=targets[scene].map((t,n)=>'<button data-item="'+n+'" class="'+((found[scene]||[]).includes(n)?'found':'')+'"><img alt="Objet à trouver" src="'+thumb(n)+'"><small>'+t+'</small></button>').join('')}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=+b.dataset.scene;scale=1;dx=dy=0;menu();draw()});document.getElementById('zin').onclick=()=>zoom(1.4);document.getElementById('zout').onclick=()=>zoom(1/1.4);document.getElementById('showtop').onclick=()=>document.getElementById('top').classList.toggle('hidden');document.getElementById('showbottom').onclick=()=>document.getElementById('bottom').classList.toggle('hidden');document.getElementById('reset').onclick=()=>{found[scene]=[];localStorage.setItem('mm-v08-found',JSON.stringify(found));menu()};canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);drag=[e.clientX,e.clientY]});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){dx+=(e.clientX-old[0])*devicePixelRatio;dy+=(e.clientY-old[1])*devicePixelRatio;draw()}else if(pointers.size===2){let a=[...pointers.values()],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(window.lastDist)zoom(dist/window.lastDist,(a[0][0]+a[1][0])*devicePixelRatio/2,(a[0][1]+a[1][1])*devicePixelRatio/2);window.lastDist=dist}});canvas.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag[0],e.clientY-drag[1])<9)discover(e);pointers.delete(e.pointerId);window.lastDist=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX*devicePixelRatio,e.clientY*devicePixelRatio)},{passive:false});canvas.addEventListener('dblclick',e=>zoom(1.8,e.clientX*devicePixelRatio,e.clientY*devicePixelRatio));menu();addEventListener('resize',resize);resize();</script></html>
