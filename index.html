:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f1df;background:#10272b}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.app{display:flex;flex-direction:column;height:100dvh;min-height:430px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;background:#18383a;z-index:2;box-shadow:0 2px 12px #0003}.brand{font-family:Georgia,serif;font-weight:800;font-size:19px;letter-spacing:.2px}.subtitle{font-size:11px;color:#b9d9ce}.top button,.actions button{background:#355456;color:#fff;border:1px solid #64817b;border-radius:11px;padding:10px}.top small{display:block;color:#b9d9ce}.stage{position:relative;flex:1;overflow:hidden;background:#243c39;touch-action:none;cursor:grab}.stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%;touch-action:none}.notice{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#172c2de8;padding:9px 14px;border-radius:99px;font-size:12px;white-space:nowrap;pointer-events:none;max-width:95%;overflow:hidden;text-overflow:ellipsis}.zoom{position:absolute;right:12px;bottom:14px;display:flex;gap:7px}.zoom button{background:#122d2be8;color:white;border:1px solid #8fada4;border-radius:12px;min-width:45px;height:45px;font-weight:700;font-size:19px}.bottom{background:#18383a;padding:11px 12px max(13px,env(safe-area-inset-bottom));max-height:41dvh;overflow:auto}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar strong{font-size:14px}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:12px}.targets{display:flex;gap:9px;overflow:auto;padding:10px 0 3px;scroll-snap-type:x mandatory}.target{flex:0 0 138px;background:#2c4949;border:1px solid #52716b;border-radius:12px;padding:10px;scroll-snap-align:start;min-height:91px}.target.found{opacity:.55;border-color:#7db58b}.target .num{font-size:10px;color:#b3d4cb}.target b{display:block;margin:5px 0;font-size:13px}.target span{font-size:11px;color:#e6c895}.feedback{font-size:12px;color:#d2dfd7;min-height:16px}.modal{position:fixed;inset:0;background:#061419cd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.dialog{background:#f5eddb;color:#1d3433;border-radius:19px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 70px #0005}.dialog h2{font-family:Georgia,serif;margin:0 0 8px;font-size:27px}.dialog p{line-height:1.5}.dialog button{background:#245e57;color:white;border:0;border-radius:11px;padding:12px 15px;margin:5px 5px 5px 0}.dialog button.secondary{background:#d7e4da;color:#193c38}.hidden{display:none!important}@media(min-width:850px){.app{max-width:1450px;margin:auto}.bottom{max-height:220px}.stage{min-height:420px}} </style></head><body><div class="app"><header class="top"><div><div class="brand">MILLE MONDES <span style="color:#e8bc73">✦</span></div><div class="subtitle">Histoire vivante · Rome, vers 117 apr. J.-C. · reconstitution imaginaire</div></div><button id="modeBtn" aria-label="Choisir la difficulté">Mode : enfant</button></header><main id="stage" class="stage" aria-label="Illustration interactive de Rome antique"><canvas id="view"></canvas><div class="notice" id="notice">Glisse pour explorer · pince pour zoomer · touche un objet</div><div class="zoom"><button id="minus" aria-label="Réduire">−</button><button id="plus" aria-label="Agrandir">+</button><button id="reset" aria-label="Recentrer">⌂</button></div></main><section class="bottom"><div class="bar"><strong id="progress">0 / 6 découvertes</strong><div class="actions"><button id="hint">💡 Indice</button><button id="info">📜 Histoire</button><button id="restart">↻ Recommencer</button></div></div><div class="targets" id="targets"></div><div class="feedback" id="feedback" role="status" aria-live="polite">Trouve les éléments dans l'image, pas dans cette liste.</div></section></div><div class="modal hidden" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalButtons"></div></div></div><script>
'use strict';const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d',{alpha:false}),stage=document.querySelector('#stage');const img=new Image();img.src='assets/rome-4k.webp';let imageReady=false;img.onload=()=>{imageReady=true;fit();draw()};img.onerror=()=>message('Image manquante : vérifie le dossier assets.');
// Positions sur la véritable illustration, coordonnées normalisées dans l'image.
const ITEMS=[
{id:'fontaine',name:'La fontaine du forum',x:.615,y:.704,r:.045,fact:'Les fontaines publiques fournissaient de l’eau aux habitants. L’eau arrivait souvent par un réseau d’aqueducs et de conduites.'},
{id:'temple',name:'Le grand temple',x:.666,y:.305,r:.088,fact:'Les temples romains accueillaient le culte des divinités. Les cérémonies publiques se déroulaient souvent devant l’édifice.'},
{id:'arc',name:'L’arc monumental',x:.115,y:.170,r:.075,fact:'Les arcs honorifiques commémoraient des événements, des victoires ou des personnages importants.'},
{id:'statue',name:'La statue équestre',x:.724,y:.490,r:.047,fact:'Une statue équestre représente une personne à cheval et sert notamment à honorer une figure politique ou militaire.'},
{id:'navires',name:'Les navires marchands',x:.355,y:.124,r:.077,fact:'Les ports et les navires étaient essentiels pour acheminer les céréales, l’huile et le vin dans le monde romain.'},
{id:'etals',name:'Les étals du marché',x:.470,y:.446,r:.076,fact:'Les marchés romains étaient des lieux d’échanges où l’on vendait produits alimentaires et objets du quotidien.'}
];
const PROFILES={
'enfant67':{label:'Enfants 6–7 ans',hit:1.35,clues:ITEMS.map(i=>i.name)},
'enfant810':{label:'Enfants 8–10 ans',hit:1.12,clues:['Où les habitants prennent-ils de l’eau ?','Trouve le bâtiment avec de grandes colonnes.','Cherche le grand passage de pierre décoré.','Trouve le cheval et son cavalier en bronze.','Cherche les bateaux qui transportent des marchandises.','Où sont les marchands et leurs marchandises ?']},
'adulte':{label:'Adultes · normal',hit:1,clues:['Le point d’eau public','Le lieu des cultes publics','Un monument honorifique','Un hommage à cheval','Les transports maritimes','Le commerce en plein air']},
'difficile':{label:'Adultes · difficile',hit:.87,clues:['L’eau à la portée de tous','Les divinités derrière le fronton','La gloire pétrifiée','Le pouvoir à quatre jambes','L’économie portée par le vent','La ville se ravitaille']},
'expert':{label:'Adultes · expert',hit:.75,clues:['Un réseau hydraulique aboutit ici','Culte civique et monumentalité','Commémorer sans offrir de toit','L’autorité représentée en selle','Des échanges d’une rive à l’autre','L’urbanité commerçante']}
};
const LABELS={enfant67:'Enfant 6–7',enfant810:'Enfant 8–10',adulte:'Adulte normal',difficile:'Adulte difficile',expert:'Adulte expert'};
let mode=localStorage.getItem('mm-mode')||'enfant67';
if(mode==='enfant')mode='enfant67';
if(!PROFILES[mode])mode='enfant67';
function readProgress(m){let data=localStorage.getItem('mm-found-'+m);if(data===null&&m==='enfant67')data=localStorage.getItem('mm-found-enfant');try{const arr=JSON.parse(data||'[]');return new Set(Array.isArray(arr)?arr.filter(id=>ITEMS.some(i=>i.id===id)):[])}catch{return new Set()}}
let found=readProgress(mode),scale=1,ox=0,oy=0,shownHint=null,pointers=new Map(),lastDist=0,moved=false,downPos=null,pinchSession=false;
const debug=new URLSearchParams(location.search).has('debug');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function fit(){const w=stage.clientWidth,h=stage.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);scale=Math.min(w/img.width,h/img.height);ox=(w-img.width*scale)/2;oy=(h-img.height*scale)/2;bounds();draw()}function bounds(){const w=stage.clientWidth,h=stage.clientHeight;const iw=img.width*scale,ih=img.height*scale;ox=iw<=w?(w-iw)/2:clamp(ox,w-iw,0);oy=ih<=h?(h-ih)/2:clamp(oy,h-ih,0)}function draw(){if(!imageReady)return;const d=Math.min(devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#203d3a';ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale);for(const it of ITEMS){if(!found.has(it.id)&&shownHint===it.id){const x=ox+it.x*img.width*scale,y=oy+it.y*img.height*scale,r=Math.max(30,it.r*img.width*scale);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.strokeStyle='#ffe27a';ctx.lineWidth=4;ctx.stroke()}}for(const it of ITEMS){if(found.has(it.id)){const x=ox+it.x*img.width*scale,y=oy+it.y*img.height*scale;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fillStyle='#1e8068';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='white';ctx.font='bold 15px sans-serif';ctx.fillText('✓',x-7,y+5)}}if(debug){ctx.save();for(const it of ITEMS){const x=ox+it.x*img.width*scale,y=oy+it.y*img.height*scale,r=it.r*img.width*scale;ctx.beginPath();ctx.ellipse(x,y,r,r*img.height/img.width,0,0,Math.PI*2);ctx.strokeStyle='#ff3864';ctx.lineWidth=3;ctx.stroke();ctx.font='bold 13px sans-serif';ctx.fillStyle='white';ctx.fillText(it.id,x+8,y-10)}ctx.restore()}}function zoomAt(f,cx,cy){const old=scale;scale=clamp(scale*f,Math.min(stage.clientWidth/img.width,stage.clientHeight/img.height),Math.min(stage.clientWidth/img.width,stage.clientHeight/img.height)*7);ox=cx-(cx-ox)*scale/old;oy=cy-(cy-oy)*scale/old;bounds();draw()}function message(t){document.querySelector('#feedback').textContent=t}function render(){
const profile=PROFILES[mode];
document.querySelector('#modeBtn').textContent=LABELS[mode]+' ▾';
document.querySelector('#progress').textContent=found.size+' / '+ITEMS.length+' découvertes';
document.querySelector('#targets').innerHTML=ITEMS.map((it,i)=>`<div class="target ${found.has(it.id)?'found':''}"><span class="num">${mode.startsWith('enfant')?'OBJET':'ENQUÊTE'} ${i+1}</span><b>${found.has(it.id)?'✓ '+it.name:profile.clues[i]}</b><span>${found.has(it.id)?'Découvert':mode==='expert'?'Observation minutieuse':mode.startsWith('enfant')?'À chercher dans la ville':'Retrouve l’élément'}</span></div>`).join('');
localStorage.setItem('mm-found-'+mode,JSON.stringify([...found]));
}
function modal(title,body,buttons=[['Continuer',closeModal]]){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=body;const b=document.querySelector('#modalButtons');b.replaceChildren();for(const [label,fn] of buttons){const el=document.createElement('button');el.textContent=label;el.onclick=fn;b.append(el)}document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}function locate(x,y){
if(!imageReady)return;
const nx=(x-ox)/(img.width*scale),ny=(y-oy)/(img.height*scale);
if(nx<0||nx>1||ny<0||ny>1){message('Explore l’illustration pour trouver les objets.');return}
const profile=PROFILES[mode];
const closest=ITEMS.filter(it=>!found.has(it.id)).map(it=>({...it,dist:Math.hypot(nx-it.x,ny-it.y)})).sort((a,b)=>a.dist-b.dist);
const it=closest.find(it=>it.dist<=it.r*profile.hit);
if(!it){message('Pas encore ! Agrandis l’image pour mieux observer.');return}
found.add(it.id);shownHint=null;render();draw();
if(found.size===ITEMS.length)modal('Dernière découverte : '+it.name,it.fact,[['Voir mon bilan',()=>modal('Rome explorée !','Bravo ! Les six découvertes sont terminées. Tu peux recommencer à un autre niveau ou continuer à explorer librement.',[['Choisir un niveau',chooseMode],['Continuer',closeModal]])],['Continuer',closeModal]]);
else modal('Découverte : '+it.name,it.fact);
}
function eventXY(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}stage.addEventListener('pointerdown',e=>{
if(e.target!==canvas)return;
stage.setPointerCapture(e.pointerId);
const p=eventXY(e);pointers.set(e.pointerId,p);
if(pointers.size===1){downPos=p;moved=false;pinchSession=false}
else {pinchSession=true;moved=true;downPos=null;lastDist=0}
});
stage.addEventListener('pointermove',e=>{
if(!pointers.has(e.pointerId))return;
const q=eventXY(e),prev=pointers.get(e.pointerId);pointers.set(e.pointerId,q);
if(pointers.size===1&&!pinchSession){
ox+=q.x-prev.x;oy+=q.y-prev.y;
if(downPos&&Math.hypot(q.x-downPos.x,q.y-downPos.y)>8)moved=true;
bounds();draw();
}else if(pointers.size===2){
pinchSession=true;moved=true;
const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
if(lastDist)zoomAt(dist/lastDist,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);
lastDist=dist;
}
});
stage.addEventListener('pointerup',e=>{
if(!pointers.has(e.pointerId))return;
const q=eventXY(e);
if(pointers.size===1&&!moved&&!pinchSession&&downPos&&Math.hypot(q.x-downPos.x,q.y-downPos.y)<10)locate(q.x,q.y);
pointers.delete(e.pointerId);lastDist=0;
if(pointers.size===0){pinchSession=false;downPos=null}
});
stage.addEventListener('pointercancel',e=>{
pointers.delete(e.pointerId);lastDist=0;pinchSession=true;
if(pointers.size===0){pinchSession=false;downPos=null}
});
stage.addEventListener('wheel',e=>{e.preventDefault();const p=eventXY(e);zoomAt(e.deltaY<0?1.18:.85,p.x,p.y)},{passive:false});document.querySelector('#plus').onclick=()=>zoomAt(1.5,stage.clientWidth/2,stage.clientHeight/2);document.querySelector('#minus').onclick=()=>zoomAt(1/1.5,stage.clientWidth/2,stage.clientHeight/2);document.querySelector('#reset').onclick=fit;document.querySelector('#hint').onclick=()=>{const it=ITEMS.find(it=>!found.has(it.id));if(!it){message('Tu as déjà tout trouvé !');return}shownHint=it.id;draw();message('Zone mise en évidence : '+it.name)};function chooseMode(){modal('Choisir un parcours','Même illustration, mais des indices et une précision adaptés à chaque niveau.',Object.keys(PROFILES).map(m=>[PROFILES[m].label,()=>setMode(m)]))}
document.querySelector('#modeBtn').onclick=chooseMode;
function setMode(m){if(!PROFILES[m])return;mode=m;localStorage.setItem('mm-mode',mode);found=readProgress(mode);shownHint=null;render();closeModal();draw();message('Parcours '+PROFILES[mode].label+' sélectionné.')}
document.querySelector('#restart').onclick=()=>modal('Recommencer ?','Les découvertes du parcours actuel seront effacées.',[['Effacer ma progression',()=>{found.clear();render();draw();closeModal()}],['Annuler',closeModal]]);document.querySelector('#info').onclick=()=>modal('À propos de la scène','Il s’agit d’une illustration imaginaire inspirée du monde romain, non d’une reconstitution topographique fidèle de Rome en 117. Les monuments et bâtiments sont regroupés librement. Le contenu pédagogique de cette démonstration porte sur les fonctions des lieux et des objets.');addEventListener('resize',()=>imageReady&&fit());render();
</script></body></html>
