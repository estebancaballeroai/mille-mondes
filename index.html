11px;color:#e6c895}.feedback{font-size:12px;color:#d2dfd7;min-height:16px}.modal{position:fixed;inset:0;background:#061419cd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.dialog{background:#f5eddb;color:#1d3433;border-radius:19px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 70px #0005}.dialog h2{font-family:Georgia,serif;margin:0 0 8px;font-size:27px}.dialog p{line-height:1.5}.dialog button{background:#245e57;color:white;border:0;border-radius:11px;padding:12px 15px;margin:5px 5px 5px 0}.dialog button.secondary{background:#d7e4da;color:#193c38}.hidden{display:none!important}@media(min-width:850px){.app{max-width:1450px;margin:auto}.bottom{max-height:220px}.stage{min-height:420px}} </style></head><body><div class="app"><header class="top"><div><div class="brand">MILLE MONDES <span style="color:#e8bc73">✦</span></div><div class="subtitle">Histoire vivante · Rome, vers 117 apr. J.-C. · reconstitution imaginaire</div></div><button id="modeBtn">Mode : enfant</button></header><main id="stage" class="stage" aria-label="Illustration interactive de Rome antique"><canvas id="view"></canvas><div class="notice" id="notice">Glisse pour explorer · pince pour zoomer · touche un objet</div><div class="zoom"><button id="minus" aria-label="Réduire">−</button><button id="plus" aria-label="Agrandir">+</button><button id="reset" aria-label="Recentrer">⌂</button></div></main><section class="bottom"><div class="bar"><strong id="progress">0 / 6 découvertes</strong><div class="actions"><button id="hint">💡 Indice</button><button id="info">📜 Histoire</button><button id="restart">↻ Recommencer</button></div></div><div class="targets" id="targets"></div><div class="feedback" id="feedback">Trouve les éléments dans l'image, pas dans cette liste.</div></section></div><div class="modal hidden" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalButtons"></div></div></div><script>
'use strict';const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d',{alpha:false}),stage=document.querySelector('#stage');const img=new Image();img.src='assets/rome-4k.webp';let imageReady=false;img.onload=()=>{imageReady=true;fit();draw()};img.onerror=()=>message('Image manquante : vérifie le dossier assets.');
const ITEMS=[{id:'fontaine',name:'La fontaine du forum',x:.65,y:.70,r:.052,fact:'Les fontaines publiques étaient importantes pour l’approvisionnement en eau des villes romaines.'},{id:'temple',name:'Le grand temple',x:.56,y:.21,r:.09,fact:'Les temples romains servaient aux cultes publics. Leur architecture associait souvent colonnes, fronton et podium.'},{id:'arc',name:'L’arc monumental',x:.91,y:.26,r:.075,fact:'Les arcs monumentaux commémoraient des événements, des dirigeants ou des victoires.'},{id:'statue',name:'La statue équestre',x:.66,y:.32,r:.045,fact:'Les statues équestres représentaient parfois des personnages honorés pour leur rôle politique ou militaire.'},{id:'navires',name:'Les navires marchands',x:.09,y:.13,r:.075,fact:'Le commerce maritime transportait notamment céréales, huile, vin et autres produits dans le monde romain.'},{id:'etals',name:'Les étals du marché',x:.51,y:.62,r:.078,fact:'Les marchés rassemblaient des vendeurs de denrées, d’objets et de produits venus de différentes régions.'}];
let mode=localStorage.getItem('mm-mode')||'enfant';let found=new Set();try{found=new Set(JSON.parse(localStorage.getItem('mm-found-'+mode)||'[]'))}catch{}let scale=1,ox=0,oy=0,shownHint=null,pointers=new Map(),lastDist=0,moved=false,downPos=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function fit(){const w=stage.clientWidth,h=stage.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);scale=Math.min(w/img.width,h/img.height);ox=(w-img.width*scale)/2;oy=(h-img.height*scale)/2;bounds();draw()}function bounds(){const w=stage.clientWidth,h=stage.clientHeight;const iw=img.width*scale,ih=img.height*scale;ox=iw<=w?(w-iw)/2:clamp(ox,w-iw,0);oy=ih<=h?(h-ih)/2:clamp(oy,h-ih,0)}function draw(){if(!imageReady)return;const d=Math.min(devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#203d3a';ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale);for(const it of ITEMS){if(!found.has(it.id)&&shownHint===it.id){const x=ox+it.x*img.width*scale,y=oy+it.y*img.height*scale,r=Math.max(30,it.r*img.width*scale);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.strokeStyle='#ffe27a';ctx.lineWidth=4;ctx.stroke()}}for(const it of ITEMS){if(found.has(it.id)){const x=ox+it.x*img.width*scale,y=oy+it.y*img.height*scale;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fillStyle='#1e8068';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='white';ctx.font='bold 15px sans-serif';ctx.fillText('✓',x-7,y+5)}}}function zoomAt(f,cx,cy){const old=scale;scale=clamp(scale*f,Math.min(stage.clientWidth/img.width,stage.clientHeight/img.height),Math.min(stage.clientWidth/img.width,stage.clientHeight/img.height)*7);ox=cx-(cx-ox)*scale/old;oy=cy-(cy-oy)*scale/old;bounds();draw()}function message(t){document.querySelector('#feedback').textContent=t}function render(){document.querySelector('#modeBtn').textContent='Mode : '+mode;document.querySelector('#progress').textContent=found.size+' / '+ITEMS.length+' découvertes';document.querySelector('#targets').innerHTML=ITEMS.map((it,i)=>`<div class="target ${found.has(it.id)?'found':''}"><span class="num">OBJET ${i+1}</span><b>${found.has(it.id)?'✓ ':''}${it.name}</b><span>${found.has(it.id)?'Découvert':'À chercher dans la ville'}</span></div>`).join('');localStorage.setItem('mm-found-'+mode,JSON.stringify([...found]));}function modal(title,body,buttons=[['Continuer',closeModal]]){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=body;const b=document.querySelector('#modalButtons');b.replaceChildren();for(const [label,fn] of buttons){const el=document.createElement('button');el.textContent=label;el.onclick=fn;b.append(el)}document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}function locate(x,y){if(!imageReady)return;let candidates=ITEMS.filter(it=>!found.has(it.id)).map(it=>({...it,dist:Math.hypot((x-ox)/(img.width*scale)-it.x,(y-oy)/(img.height*scale)-it.y)})).sort((a,b)=>a.dist-b.dist);let it=candidates.find(it=>it.dist<it.r*(mode==='enfant'?1.15:.75));if(!it){message('Pas encore ! Observe bien les détails.');return}found.add(it.id);shownHint=null;render();draw();modal('Découverte : '+it.name,it.fact);if(found.size===ITEMS.length)message('Bravo ! Tu as complété cette première exploration de Rome.');}function eventXY(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}stage.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,eventXY(e));downPos=eventXY(e);moved=false;lastDist=0});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const q=eventXY(e),prev=pointers.get(e.pointerId);pointers.set(e.pointerId,q);if(pointers.size===1){ox+=q.x-prev.x;oy+=q.y-prev.y;if(Math.hypot(q.x-downPos.x,q.y-downPos.y)>8)moved=true;bounds();draw()}else if(pointers.size===2){moved=true;const p=[...pointers.values()];const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(lastDist)zoomAt(dist/lastDist,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);lastDist=dist}});stage.addEventListener('pointerup',e=>{if(!pointers.has(e.pointerId))return;const q=eventXY(e);if(pointers.size===1&&!moved&&downPos&&Math.hypot(q.x-downPos.x,q.y-downPos.y)<10)locate(q.x,q.y);pointers.delete(e.pointerId);lastDist=0});stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastDist=0});stage.addEventListener('wheel',e=>{e.preventDefault();const p=eventXY(e);zoomAt(e.deltaY<0?1.18:.85,p.x,p.y)},{passive:false});document.querySelector('#plus').onclick=()=>zoomAt(1.5,stage.clientWidth/2,stage.clientHeight/2);document.querySelector('#minus').onclick=()=>zoomAt(1/1.5,stage.clientWidth/2,stage.clientHeight/2);document.querySelector('#reset').onclick=fit;document.querySelector('#hint').onclick=()=>{const it=ITEMS.find(it=>!found.has(it.id));if(!it){message('Tu as déjà tout trouvé !');return}shownHint=it.id;draw();message('Une zone lumineuse t’aide à trouver : '+it.name)};document.querySelector('#modeBtn').onclick=()=>modal('Choisir un parcours','Les deux parcours utilisent la même illustration, mais les zones de validation sont plus précises chez les adultes.',[['Enfants 6–10 ans',()=>setMode('enfant')],['Adultes',()=>setMode('adulte')]]);function setMode(m){mode=m;localStorage.setItem('mm-mode',mode);found=new Set(JSON.parse(localStorage.getItem('mm-found-'+mode)||'[]'));shownHint=null;render();closeModal();draw()}document.querySelector('#restart').onclick=()=>modal('Recommencer ?','Les découvertes du parcours actuel seront effacées.',[['Effacer ma progression',()=>{found.clear();render();draw();closeModal()}],['Annuler',closeModal]]);document.querySelector('#info').onclick=()=>modal('À propos de la scène','Il s’agit d’une illustration imaginaire inspirée du monde romain, non d’une reconstitution topographique fidèle de Rome en 117. Les monuments et bâtiments sont regroupés librement. Le contenu pédagogique de cette démonstration porte sur les fonctions des lieux et des objets.');addEventListener('resize',()=>imageReady&&fit());render();
