name: MILLE MONDES V0.4 - tests
on:
  push:
    branches:
      - 'experimental/**'
  pull_request:
    branches:
      - main
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/v04-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-v04
          path: screenshots/v04/
